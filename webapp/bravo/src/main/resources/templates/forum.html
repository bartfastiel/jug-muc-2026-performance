<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java München Forum</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin:0; font-family:Inter,sans-serif; background:#f4f6f8; color:#1f2937; }
        header { padding:3rem; text-align:center; }
        main { max-width:1400px; margin:auto; padding:2rem;
            display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:1.5rem; }
        .card { background:white; border-radius:14px; padding:1.5rem;
            box-shadow:0 10px 25px rgba(0,0,0,.08); }
        ul { list-style:none; padding:0; }
        li { display:flex; justify-content:space-between; padding:.4rem 0; }
        .emoji { color:#2563eb; font-weight:600; }
    </style>
</head>
<body>
<header>
    <h1>Java München Forum ☕</h1>
    <p>Die wichtigsten Diskussionen – sortiert nach Emotionen</p>
</header>
<main>
    <div class="card" th:each="c : ${categories}">
        <h2 th:text="${c.name}"></h2>
        <ul>
            <li th:each="t : ${c.threads}">
                <span th:text="${t.title}"></span>
                <span class="emoji" th:text="${t.emojiCount} + ' Emojis'"></span>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
